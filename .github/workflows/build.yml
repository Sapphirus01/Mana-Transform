name: Build

on: [push, pull_request]

jobs:
  build:
    name: ${{ matrix.compatibility.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compatibility:
          - name: Legacy dependencies
            dragon_survival_file_id: '7296733' # 2.0.51
            irons_spellbooks_file_id: '7402503' # 1.21.1-3.15.0
            irons_lib_argument: ''
          - name: Current dependencies
            dragon_survival_file_id: '8765068' # 2.0.68
            irons_spellbooks_file_id: '8680204' # 1.21.1-3.16.3
            irons_lib_argument: '-Pirons_lib_curse_file_id=8364894' # 1.21.1-2.1.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: >-
          ./gradlew build
          -Pdragonsurvival_curse_file_id=${{ matrix.compatibility.dragon_survival_file_id }}
          -Pirons_spellbooks_curse_file_id=${{ matrix.compatibility.irons_spellbooks_file_id }}
          ${{ matrix.compatibility.irons_lib_argument }}
          --no-configuration-cache
          --stacktrace
