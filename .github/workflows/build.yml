name: Build

on: [push, pull_request]

jobs:
  build:
    name: Dragon Survival ${{ matrix.dragon_survival.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dragon_survival:
          - version: '2.0.51'
            curse_file_id: '7296733'
          - version: '2.0.66'
            curse_file_id: '8713690'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build -Pdragonsurvival_curse_file_id=${{ matrix.dragon_survival.curse_file_id }}
